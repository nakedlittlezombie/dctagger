<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f17'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234cd7f6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%234cd7f6'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>DCTagger — Discogs music tagger</title>
    <style>
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f17;
        color: #dfe2ee;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .boot-fallback-inner {
        max-width: 560px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #131b2e;
        border-radius: 4px;
        padding: 28px;
      }
      .boot-fallback .mark {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: #4cd7f6;
      }
      .boot-fallback h1 {
        font-size: 22px;
        margin: 10px 0 6px;
        font-weight: 600;
      }
      .boot-fallback p {
        margin: 6px 0;
        color: #bcc9cd;
        font-size: 13px;
        line-height: 1.5;
      }
      .boot-fallback .detail {
        margin-top: 14px;
        padding: 10px;
        background: #0a0e16;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        color: #ffb95f;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        white-space: pre-wrap;
        text-align: left;
        overflow: auto;
        max-height: 180px;
      }
      .boot-fallback a {
        color: #4cd7f6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" id="boot-fallback">
        <div class="boot-fallback-inner">
          <div class="mark">DCTAGGER // LOCAL ENGINE</div>
          <h1>Starting interface…</h1>
          <p>
            If this message stays on screen, the UI bundle did not load. Check the browser
            console and confirm the API is reachable at
            <a href="/api/health">/api/health</a>.
          </p>
          <p class="detail" id="boot-detail" hidden></p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; color: #dfe2ee; background: #0b0f17; font-family: sans-serif">
        DCTagger needs JavaScript enabled.
      </div>
    </noscript>
    <script>
      (function () {
        var detail = document.getElementById("boot-detail");
        function show(message) {
          if (!detail) return;
          detail.hidden = false;
          detail.textContent = String(message || "Unknown startup error");
        }
        window.addEventListener("error", function (event) {
          show(event.error && event.error.stack ? event.error.stack : event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          show(reason && reason.stack ? reason.stack : reason);
        });
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
